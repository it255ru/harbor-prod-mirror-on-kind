# Source of truth for the numbers below: hack/config/kind-cluster.yaml, Makefile (LB_IP), docs/stand-topology.md.
kube_context: kind-harbor
deps_ns: harbor-deps            # hack/ha/00-namespace.yaml
app_ns: default                 # namespace of Harbor and the demo app

lb_ip: 172.20.0.100             # Infra LB: Keepalived VIP (Makefile LB_IP, hack/ha/infra-lb.yaml)
demo_nodeport: 30500            # NodePort of the demo app (hello-service), on the control-plane node
demo_node: harbor-control-plane
kind_subnet: 172.20.0.0/16      # docker network "kind"

harbor_host: core.harbor.domain
harbor_admin_user: admin
harbor_admin_password: Harbor12345   # lab default only (see CLAUDE.md), never a real credential

expected_nodes: 14
expected_roles: {app: 2, lb: 2, pg: 2, redis: 3, consul: 3, s3: 1}
expected_tainted_nodes: 13      # every worker; the control-plane has its own taint

# Images for the reachability jobs (V9); the same pins as in hack/ha/*.yaml.
image_pg: postgres:15.19-alpine3.24@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
image_valkey: valkey/valkey:9.0.6-alpine3.24@sha256:187679e3bd4036959631e3f03983ab2ba503ab21e6fd0454d508e909db2ee989

# Switches. The checks that write (V5.4, V6.3, V9, V11.6) clean up after themselves.
verify_writes: true             # V5.4, V6.3, V9.x: temporary table/key/Job
verify_rollout: false           # V11.6: kubectl rollout restart deploy/harbor-core (replaces pods, run when calm)
verify_load_requests: 100       # V12: requests per component
