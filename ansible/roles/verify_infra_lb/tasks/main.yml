# V3: Infra LB = Keepalived (VIP) + HAProxy (TCP passthrough to the Harbor nginx pods), DaemonSet infra-lb on the lb nodes.
- name: V3 | infra-lb pods
  kubernetes.core.k8s_info: {kind: Pod, namespace: "{{ deps_ns }}", label_selectors: ["app=infra-lb"]}
  register: v3_pods
- name: V3 | which lb node holds the VIP
  ansible.builtin.command: docker exec {{ item }} ip -4 addr show eth0
  loop: "{{ role_of | dict2items | selectattr('value', 'eq', 'lb') | map(attribute='key') | list }}"
  register: v3_vip
  changed_when: false
  failed_when: false
- name: V3 | HAProxy backends of the Infra LB (stats on the node loopback)
  ansible.builtin.command: docker exec {{ item }} curl -s 'http://127.0.0.1:8405/stats;csv'
  loop: "{{ role_of | dict2items | selectattr('value', 'eq', 'lb') | map(attribute='key') | list }}"
  register: v3_stats
  changed_when: false
  failed_when: false
- name: V3 | docker network
  ansible.builtin.command: docker network inspect -f '{% raw %}{{range .IPAM.Config}}{{.Subnet}} {{end}}{% endraw %}' kind
  register: v3_net
  changed_when: false
  failed_when: false
- name: V3 | HTTP and HTTPS on the LB address
  ansible.builtin.uri:
    url: "{{ item }}://{{ lb_ip }}/"
    validate_certs: false
    follow_redirects: none
    timeout: 5
    status_code: [-1, 200, 301, 302, 308, 502, 503]
  loop: [http, https]
  register: v3_http
  failed_when: false

- name: V3 | record
  vars:
    lbpods: >-
      {{ v3_pods.resources | selectattr('status.phase', 'eq', 'Running') | rejectattr('metadata.deletionTimestamp', 'defined') | list }}
    lbpod_nodes: "{{ lbpods | map(attribute='spec.nodeName') | list }}"
    lbpod_ready: >-
      {{ lbpods | selectattr('status.containerStatuses', 'defined') |
         map(attribute='status.containerStatuses') | map('selectattr', 'ready') | map('list') | map('length') | select('eq', 2) | list | length }}
    holders: "{{ v3_vip.results | selectattr('stdout', 'search', ' ' ~ lb_ip ~ '/') | map(attribute='item') | list }}"
    up: >-
      {%- set out = [] -%}
      {%- for r in v3_stats.results -%}
      {%- set n = r.stdout | default('') | regex_findall('(?m)^harbor_https,nginx[0-9]+,[^\n]*$') | select('search', ',UP,') | list | length -%}
      {%- set _ = out.append(r.item ~ '=' ~ n) -%}
      {%- endfor -%}
      {{ out }}
    codes: "{{ v3_http.results | map(attribute='status') | list }}"
  ansible.builtin.set_fact:
    verify_results: >-
      {{ verify_results + [
        {'id': 'V3.1', 't': 'two infra-lb pods (haproxy + keepalived, both containers ready) on different lb nodes',
         's': 'PASS' if (lbpods | length == 2 and lbpod_nodes | unique | length == 2 and (lbpod_nodes | map('extract', role_of) | unique | list) == ['lb'] and lbpod_ready | int == 2) else 'FAIL',
         'd': lbpod_nodes | join(', ')},
        {'id': 'V3.2', 't': 'VIP ' ~ lb_ip ~ ' on exactly one lb node; kind subnet ' ~ kind_subnet,
         's': 'PASS' if (holders | length == 1 and kind_subnet in v3_net.stdout | default('')) else 'FAIL',
         'd': 'holder ' ~ (holders | join(',') or 'none') ~ ', network ' ~ (v3_net.stdout | default('?') | trim)},
        {'id': 'V3.3', 't': 'LB answers from the host (Harbor UI 200 over https, http redirects)',
         's': 'PASS' if (codes[1] | default(0) == 200 and codes[0] | default(0) in [301, 302, 308]) else 'FAIL', 'd': 'http/https ' ~ codes | join('/')},
        {'id': 'V3.4', 't': 'both HAProxy see both Harbor nginx pods UP (backend harbor_https)',
         's': 'PASS' if (up | length == 2 and up | select('search', '=2$') | list | length == 2) else 'FAIL', 'd': up | join(', ')}
      ] }}
